# Example Secret for standalone (API key) authentication.
# Create this in the same namespace as your DigiCertIssuer,
# or in --cluster-resource-namespace (default: cert-manager) for DigiCertClusterIssuer.
apiVersion: v1
kind: Secret
metadata:
  name: digicert-issuer-credentials
  namespace: default  # change to cert-manager for DigiCertClusterIssuer
type: Opaque
stringData:
  api-key: "YOUR_API_KEY_HERE"
---
