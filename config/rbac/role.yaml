---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - issuer.digicert.com
  resources:
  - digicertclusterissuers
  - digicertissuers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - issuer.digicert.com
  resources:
  - digicertclusterissuers/status
  - digicertissuers/status
  verbs:
  - get
  - patch
  - update
