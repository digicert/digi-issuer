# This rule is not used by the project digicert-issuer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over issuer.issuer.digicert.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: digicert-issuer
    app.kubernetes.io/managed-by: kustomize
  name: digicertclusterissuer-admin-role
rules:
- apiGroups:
  - issuer.issuer.digicert.com
  resources:
  - digicertclusterissuers
  verbs:
  - '*'
- apiGroups:
  - issuer.issuer.digicert.com
  resources:
  - digicertclusterissuers/status
  verbs:
  - get
