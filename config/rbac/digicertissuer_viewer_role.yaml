# This rule is not used by the project digicert-issuer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to issuer.issuer.digicert.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: digicert-issuer
    app.kubernetes.io/managed-by: kustomize
  name: digicertissuer-viewer-role
rules:
- apiGroups:
  - issuer.issuer.digicert.com
  resources:
  - digicertissuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - issuer.issuer.digicert.com
  resources:
  - digicertissuers/status
  verbs:
  - get
